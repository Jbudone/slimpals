services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-slimpals}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slimpals}
      MYSQL_USER: ${MYSQL_USER:-slimpals}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-slimpals}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-slimpals}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/jbudone/slimpals:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-slimpals}:${MYSQL_PASSWORD:-slimpals}@mysql:3306/${MYSQL_DATABASE:-slimpals}
      NODE_ENV: production
      PORT: 3000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      BUNNYCDN_API_KEY: ${BUNNYCDN_API_KEY:-}
      BUNNYCDN_STORAGE_ZONE: ${BUNNYCDN_STORAGE_ZONE:-}
      BUNNYCDN_CDN_URL: ${BUNNYCDN_CDN_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN:-localhost}}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mysql_data:
  uploads:
  certbot_www:
  certbot_certs:
